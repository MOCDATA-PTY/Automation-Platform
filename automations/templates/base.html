<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Automations{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #faf9f8;
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar - Microsoft Style */
        .sidebar {
            width: 48px;
            background: #054B70;
            min-height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            transition: width 0.2s ease;
            z-index: 100;
            display: flex;
            flex-direction: column;
        }

        .sidebar:hover {
            width: 220px;
        }

        .sidebar-header {
            padding: 16px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-logo {
            width: 24px;
            height: 24px;
            background: #94BCCC;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sidebar-logo svg {
            width: 16px;
            height: 16px;
            fill: #054B70;
        }

        .sidebar-brand {
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            margin-left: 12px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .sidebar:hover .sidebar-brand {
            opacity: 1;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
        }

        .sidebar-menu {
            list-style: none;
            padding: 8px 0;
            flex: 1;
        }

        .sidebar-menu li {
            margin: 2px 4px;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            font-size: 13px;
            border-radius: 4px;
            transition: background 0.1s ease;
        }

        .sidebar-menu a:hover {
            background: rgba(255,255,255,0.1);
        }

        .sidebar-menu a.active {
            background: rgba(148, 188, 204, 0.3);
            color: #fff;
        }

        .sidebar-menu .icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .sidebar-menu .icon svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .sidebar-menu .label {
            margin-left: 12px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .sidebar:hover .sidebar-menu .label {
            opacity: 1;
        }

        /* Main Content */
        .main-content {
            margin-left: 48px;
            flex: 1;
            padding: 24px 32px;
            min-height: 100vh;
            transition: margin-left 0.2s ease;
        }

        .page-header {
            margin-bottom: 24px;
        }

        .page-title {
            color: #323130;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .page-subtitle {
            color: #605e5c;
            font-size: 14px;
            font-weight: 400;
        }

        {% block extra_styles %}{% endblock %}
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <svg viewBox="0 0 24 24"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/></svg>
            </div>
            <span class="sidebar-brand">MOC Automations</span>
        </div>

        <ul class="sidebar-menu">
            <li>
                <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">
                    <span class="icon">
                        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    </span>
                    <span class="label">Home</span>
                </a>
            </li>
            <li>
                <a href="{% url 'turnover' %}" class="{% if request.resolver_match.url_name == 'turnover' %}active{% endif %}">
                    <span class="icon">
                        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
                    </span>
                    <span class="label">Turnover</span>
                </a>
            </li>
            <li>
                <a href="{% url 'pnl' %}" class="{% if request.resolver_match.url_name == 'pnl' %}active{% endif %}">
                    <span class="icon">
                        <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12zm-6-1h2V9h-2v6zm-4 0h2v-4h-2v4zm8 0h2V7h-2v8z"/></svg>
                    </span>
                    <span class="label">Atlantics</span>
                </a>
            </li>
        </ul>
        <div style="padding: 8px 4px; border-top: 1px solid rgba(255,255,255,0.1);">
            <a href="{% url 'logout' %}" class="sidebar-menu a" style="display: flex; align-items: center; padding: 10px 12px; color: rgba(255,255,255,0.85); text-decoration: none; font-size: 13px; border-radius: 4px;">
                <span class="icon" style="width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                    <svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: currentColor;"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                </span>
                <span class="label">Sign out</span>
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
