<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Automations{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #faf9f8;
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar - Microsoft Style */
        .sidebar {
            width: 48px;
            background: #054B70;
            min-height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            transition: width 0.2s ease;
            z-index: 100;
            display: flex;
            flex-direction: column;
        }

        .sidebar:hover {
            width: 220px;
        }

        .sidebar-header {
            padding: 16px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-logo {
            width: 24px;
            height: 24px;
            background: #94BCCC;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sidebar-logo svg {
            width: 16px;
            height: 16px;
            fill: #054B70;
        }

        .sidebar-brand {
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            margin-left: 12px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .sidebar:hover .sidebar-brand {
            opacity: 1;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
        }

        .sidebar-menu {
            list-style: none;
            padding: 8px 0;
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar-menu::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar-menu::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar-menu::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }

        .sidebar-menu::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.3);
        }

        .sidebar-menu li {
            margin: 2px 4px;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            font-size: 13px;
            border-radius: 4px;
            transition: background 0.1s ease;
        }

        .sidebar-menu a:hover {
            background: rgba(255,255,255,0.1);
        }

        .sidebar-menu a.active {
            background: rgba(148, 188, 204, 0.3);
            color: #fff;
        }

        .sidebar-menu .icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .sidebar-menu .icon svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .sidebar-menu .label {
            margin-left: 12px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .sidebar:hover .sidebar-menu .label {
            opacity: 1;
        }

        /* Main Content */
        .main-content {
            margin-left: 48px;
            flex: 1;
            padding: 24px 32px;
            min-height: 100vh;
            transition: margin-left 0.2s ease;
        }

        .page-header {
            margin-bottom: 24px;
        }

        .page-title {
            color: #323130;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .page-subtitle {
            color: #605e5c;
            font-size: 14px;
            font-weight: 400;
        }

        {% block extra_styles %}{% endblock %}
    </style>
</head>
<body>
