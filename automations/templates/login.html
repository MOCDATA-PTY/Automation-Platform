<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MOC Automations</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #faf9f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 360px;
            padding: 20px;
        }

        .login-card {
            background: #fff;
            border: 1px solid #edebe9;
            border-radius: 4px;
            padding: 40px 32px;
        }

        .login-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: #054B70;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon svg {
            width: 24px;
            height: 24px;
            fill: #fff;
        }

        .logo-text {
            font-size: 18px;
            font-weight: 600;
            color: #323130;
        }

        .login-title {
            font-size: 24px;
            font-weight: 600;
            color: #323130;
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 14px;
            color: #605e5c;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #323130;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            font-family: inherit;
            border: 1px solid #8a8886;
            border-radius: 2px;
            outline: none;
            transition: border-color 0.1s ease;
        }

        .form-input:focus {
            border-color: #054B70;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #054B70;
            color: #fff;
            border: none;
            border-radius: 2px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-login:hover {
            background: #043a58;
        }

        .error-message {
            background: #fde7e9;
            border: 1px solid #f1707b;
            color: #a80000;
            padding: 10px 12px;
            border-radius: 2px;
            font-size: 13px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/></svg>
                </div>
                <span class="logo-text">MOC Automations</span>
            </div>

            <h1 class="login-title">Sign in</h1>
            <p class="login-subtitle">Enter your credentials to continue</p>

            {% if error %}
            <div class="error-message">{{ error }}</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-input" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-input" required>
                </div>
                <button type="submit" class="btn-login">Sign in</button>
            </form>
        </div>
    </div>
</body>
</html>
